name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # Gating: stylua + luacheck must pass.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: stylua (check)
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua plugin TESTS

      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y luarocks && sudo luarocks install luacheck

      - name: luacheck
        run: luacheck lua plugin TESTS

  # Real gate: the framework-free headless suite. Every backend is faked, so
  # this needs no pdftotext/python/ollama on the runner — the point is to
  # catch load errors and chain-resolution regressions, not to extract PDFs.
  # lib.nvim is checked out as a sibling (notify, usercmd.composer, tables).
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pdfport.nvim
        uses: actions/checkout@v4
        with:
          path: pdfport.nvim

      - name: Checkout lib.nvim
        uses: actions/checkout@v4
        with:
          repository: StefanBartl/lib.nvim
          path: lib.nvim

      - name: Install Neovim (stable)
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Run tests
        working-directory: pdfport.nvim
        env:
          REPOS_DIR: ${{ github.workspace }}
        run: nvim --headless -u NONE -c "set rtp+=." -c "set rtp+=../lib.nvim" -c "luafile TESTS/run.lua" -c "qa!"
