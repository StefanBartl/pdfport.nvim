name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # Gating: stylua + luacheck must pass.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: stylua (check)
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check lua plugin TESTS

      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y luarocks && sudo luarocks install luacheck 1.2.0

      - name: luacheck
        run: luacheck lua plugin TESTS

  # Real gate: the framework-free headless suite. Almost every backend is
  # faked, so this needs no python/ollama on the runner -- the point is to
  # catch load errors and chain-resolution regressions, not to extract PDFs.
  # lib.nvim is checked out as a sibling (notify, usercmd.composer, tables).
  #
  # pdftotext is the one real exception: TESTS/ai_backends_spec.lua's ollama
  # text route shells out to the actual poppler-utils binary (only the AI
  # HTTP call is faked there), the same as this plugin's own "pdftotext"
  # backend would for a real user -- so it has to be on PATH here too.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Windows runners default to PowerShell; one shell on all three keeps
        # the run step itself from being what differs between platforms.
        shell: bash
    steps:
      - name: Checkout pdfport.nvim
        uses: actions/checkout@v5
        with:
          path: pdfport.nvim

      - name: Checkout lib.nvim
        uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: lib.nvim
          ref: ci-verified

      - name: Install Neovim (stable)
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Install poppler (pdftotext)
        run: |
          # pdftotext is a real dependency of the extraction specs. Each runner
          # image needs its own package manager for it, so the install is the
          # one step that differs; everything after it is identical.
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update && sudo apt-get install -y poppler-utils ;;
            macOS)   brew install poppler || true ;;
            Windows) choco install poppler -y --no-progress ;;
          esac
          # The gate is "is it on PATH", NOT the exit code of `pdftotext -v`:
          # chocolatey ships the xpdf build, whose `-v` prints the version and
          # then exits 99. Gating on that exit code failed the Windows leg on a
          # perfectly good install -- the tool was there the whole time.
          command -v pdftotext >/dev/null || { echo "pdftotext not on PATH after install"; exit 1; }
          pdftotext -v 2>&1 | head -1 || true

      - name: Run tests
        working-directory: pdfport.nvim
        env:
          REPOS_DIR: ${{ github.workspace }}
        run: nvim --headless -u NONE -c "set rtp+=." -c "set rtp+=../lib.nvim" -c "luafile TESTS/run.lua" -c "qa!"
